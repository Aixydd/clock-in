<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#F5F0E8">
    <title>上下班打卡</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #F5F0E8;
            color: #4A4540;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 480px;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 16px;
        }

        /* ========== 顶部：标题 ========== */
        .header {
            text-align: center;
            padding: 8px 0 16px;
            flex-shrink: 0;
        }
        .header h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 3px;
        }
        .header .date {
            font-size: 15px;
            color: #A09890;
            margin-top: 6px;
        }

        /* ========== 上三分之一：时间区 ========== */
        .time-section {
            height: 33vh;
            background: #FFFDF8;
            border-radius: 32px;
            box-shadow: 0 4px 20px rgba(100,90,70,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .clock-time {
            font-size: 88px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            letter-spacing: 3px;
        }
        .clock-status {
            font-size: 20px;
            color: #A09890;
            margin-top: 10px;
        }

        /* ========== 中间：按钮区 ========== */
        .button-section {
            display: flex;
            gap: 20px;
            padding: 24px 0;
            flex-shrink: 0;
        }
        .btn {
            flex: 1;
            padding: 28px 16px;
            border: none;
            border-radius: 24px;
            font-size: 28px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 2px;
        }
        .btn:active { transform: scale(0.96); opacity: 0.9; }
        .btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }
        .btn-start {
            background: #7BA17B;
            color: white;
            box-shadow: 0 6px 20px rgba(123,161,123,0.35);
        }
        .btn-end {
            background: #C4A882;
            color: white;
            box-shadow: 0 6px 20px rgba(196,168,130,0.35);
        }

        /* ========== 底部：记录区（自动填满剩余空间） ========== */
        .record-section {
            background: #FFFDF8;
            border-radius: 32px;
            box-shadow: 0 4px 20px rgba(100,90,70,0.1);
            flex: 1;
            overflow-y: auto;
            min-height: 0;
            padding: 24px 28px;
        }
        .record-section h3 {
            font-size: 20px;
            color: #A09890;
            font-weight: 600;
            margin-bottom: 16px;
            letter-spacing: 2px;
        }
        .record-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0;
        }
        .record-label {
            font-size: 20px;
            color: #6B6560;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .record-label .dot {
            width: 12px; height: 12px;
            border-radius: 50%;
        }
        .record-label .dot.start { background: #7BA17B; }
        .record-label .dot.end { background: #C4A882; }
        .record-value {
            font-size: 24px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }
        .duration {
            margin-top: 18px;
            padding-top: 18px;
            border-top: 2px solid #EDE8E0;
            text-align: center;
            font-size: 18px;
            color: #A09890;
        }
        .duration strong {
            color: #4A4540;
            font-size: 26px;
            font-weight: 700;
        }
        .history-item {
            padding: 18px 0;
            border-bottom: 1px solid #EDE8E0;
        }
        .history-item:last-child { border-bottom: none; }
        .history-date {
            font-size: 17px;
            color: #C0B8B0;
            margin-bottom: 8px;
            font-weight: 500;
        }
        .history-times {
            display: flex;
            gap: 24px;
            font-size: 20px;
            color: #6B6560;
        }
        .empty {
            text-align: center;
            color: #D0C8C0;
            padding: 40px 16px;
            font-size: 20px;
        }

        .toast {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(74,69,64,0.9);
            color: white;
            padding: 18px 32px;
            border-radius: 16px;
            font-size: 18px;
            font-weight: 500;
            opacity: 0;
            transition: opacity 0.25s;
            pointer-events: none;
            z-index: 100;
            letter-spacing: 1px;
        }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>上下班打卡</h1>
            <div class="date" id="currentDate"></div>
        </div>

        <!-- 顶部三分之一：时间 -->
        <div class="time-section">
            <div class="clock-time" id="currentTime">--:--</div>
            <div class="clock-status" id="statusLabel">等待打卡</div>
        </div>

        <!-- 中间：按钮 -->
        <div class="button-section">
            <button class="btn btn-start" id="btnStart" onclick="clockIn()">上班打卡</button>
            <button class="btn btn-end" id="btnEnd" onclick="clockOut()">下班打卡</button>
        </div>

        <!-- 底部：记录 -->
        <div class="record-section">
            <h3>最近记录</h3>
            <div id="todayContent"></div>
            <div class="duration" id="durationBox" style="display:none"></div>
            <div id="historyList">
                <div class="empty">暂无记录</div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        function getToday() { return new Date().toISOString().split('T')[0]; }
        function formatTime(d) { return new Date(d).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }); }
        function formatDate(ds) {
            const d = new Date(ds), t = new Date(getToday());
            const y = new Date(t); y.setDate(y.getDate() - 1);
            if (ds === getToday()) return '今天';
            if (ds === y.toISOString().split('T')[0]) return '昨天';
            return `${d.getMonth()+1}月${d.getDate()}日`;
        }
        function getRecords() { return JSON.parse(localStorage.getItem('clockRecords') || '{}'); }
        function saveRecords(r) { localStorage.setItem('clockRecords', JSON.stringify(r)); }
        function getTodayRecord() { return getRecords()[getToday()] || null; }

        function clockIn() {
            const records = getRecords(), today = getToday();
            if (records[today] && records[today].start) { showToast('今天已经打过上班卡了'); return; }
            records[today] = { ...records[today], start: new Date().toISOString() };
            saveRecords(records);
            showToast('上班打卡成功');
            updateUI();
        }
        function clockOut() {
            const records = getRecords(), today = getToday();
            if (!records[today] || !records[today].start) { showToast('请先打上班卡'); return; }
            if (records[today].end) { showToast('今天已经打过下班卡了'); return; }
            records[today].end = new Date().toISOString();
            saveRecords(records);
            showToast('下班打卡成功');
            updateUI();
        }
        function calcDuration(s, e) {
            if (!s || !e) return null;
            const ms = new Date(e) - new Date(s);
            return `${Math.floor(ms/3600000)}小时${Math.floor((ms%3600000)/60000)}分钟`;
        }

        function updateUI() {
            const rec = getTodayRecord();
            const content = document.getElementById('todayContent');
            const dur = document.getElementById('durationBox');
            const label = document.getElementById('statusLabel');
            const btnS = document.getElementById('btnStart');
            const btnE = document.getElementById('btnEnd');

            if (rec) {
                let h = '';
                if (rec.start) h += `<div class="record-row"><div class="record-label"><span class="dot start"></span>上班</div><div class="record-value">${formatTime(rec.start)}</div></div>`;
                if (rec.end) h += `<div class="record-row"><div class="record-label"><span class="dot end"></span>下班</div><div class="record-value">${formatTime(rec.end)}</div></div>`;
                content.innerHTML = h;
                if (rec.start && rec.end) {
                    dur.style.display = 'block';
                    dur.innerHTML = `工作时长 <strong>${calcDuration(rec.start, rec.end)}</strong>`;
                    label.textContent = '今日已完成';
                    btnS.disabled = true; btnE.disabled = true;
                } else {
                    label.textContent = '工作中';
                    btnS.disabled = true; btnE.disabled = false;
                    dur.style.display = 'none';
                }
            } else {
                content.innerHTML = '';
                label.textContent = '等待打卡';
                btnS.disabled = false; btnE.disabled = false;
                dur.style.display = 'none';
            }
            updateHistory();
        }

        function updateHistory() {
            const records = getRecords();
            const dates = Object.keys(records).sort().reverse().slice(0, 7);
            const el = document.getElementById('historyList');
            if (!dates.length) { el.innerHTML = '<div class="empty">暂无记录</div>'; return; }
            let h = '';
            dates.forEach(d => {
                const r = records[d];
                h += `<div class="history-item"><div class="history-date">${formatDate(d)}</div><div class="history-times">
                    <span>上班 ${formatTime(r.start)}</span>
                    ${r.end ? `<span>下班 ${formatTime(r.end)}</span>` : '<span style="color:#D0C8C0">未打下班卡</span>'}
                </div></div>`;
            });
            el.innerHTML = h;
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 1500);
        }

        function updateClock() {
            const now = new Date();
            document.getElementById('currentTime').textContent =
                now.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            document.getElementById('currentDate').textContent =
                now.toLocaleDateString('zh-CN', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
        }

        updateClock(); setInterval(updateClock, 1000); updateUI();
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(rs => { for(let r of rs) r.unregister(); });
            navigator.serviceWorker.register('sw.js?t=' + Date.now()).catch(() => {});
        }
    </script>
</body>
</html>
