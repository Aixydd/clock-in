<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#F6F1E7">
    <title>上下班打卡</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body { height: 100%; overflow: hidden; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(180deg, #F3EDE2 0%, #F6F1E7 40%, #F8F4EC 100%);
            color: #3E3933;
            display: flex;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 460px;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 20px;
        }

        /* ========== 时间卡片 ========== */
        .time-card {
            background: #FFFFFF;
            border-radius: 28px;
            box-shadow: 0 8px 32px rgba(120,100,70,0.1);
            padding: 32px 24px 28px;
            text-align: center;
            flex-shrink: 0;
        }
        .date-line {
            font-size: 15px;
            color: #A79E92;
            letter-spacing: 1px;
        }
        .clock-time {
            font-size: 76px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            letter-spacing: 2px;
            margin: 14px 0 6px;
            color: #332D26;
        }
        .status-pill {
            display: inline-block;
            padding: 8px 20px;
            border-radius: 999px;
            background: #F3EDE2;
            color: #8A7F6F;
            font-size: 15px;
            letter-spacing: 1px;
        }
        .status-pill.working {
            background: #E8F0E4;
            color: #5F7D5B;
        }
        .status-pill.done {
            background: #EDE6D8;
            color: #8A7355;
        }

        /* ========== 按钮区 ========== */
        .buttons {
            display: flex;
            gap: 16px;
            flex-shrink: 0;
        }
        .btn {
            flex: 1;
            padding: 26px 12px;
            border: none;
            border-radius: 24px;
            font-size: 21px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
            letter-spacing: 2px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            color: #FFFFFF;
        }
        .btn .icon { font-size: 30px; line-height: 1; }
        .btn:active { transform: scale(0.95); filter: brightness(0.94); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; filter: none; }
        .btn-start {
            background: linear-gradient(160deg, #86A988 0%, #6E926F 100%);
            box-shadow: 0 8px 20px rgba(110,146,111,0.3);
        }
        .btn-end {
            background: linear-gradient(160deg, #CDB391 0%, #B99A74 100%);
            box-shadow: 0 8px 20px rgba(185,154,116,0.3);
        }

        /* ========== 记录区 ========== */
        .records {
            background: #FFFFFF;
            border-radius: 28px;
            box-shadow: 0 8px 32px rgba(120,100,70,0.1);
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 24px 24px 16px;
        }
        .records-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .records-head h3 {
            font-size: 17px;
            font-weight: 600;
            color: #6B6153;
            letter-spacing: 2px;
        }
        .records-head .count {
            font-size: 13px;
            color: #B5AB9C;
        }
        .record-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 2px;
            border-bottom: 1px solid #F3EDE2;
        }
        .record-label {
            font-size: 16px;
            color: #6B6153;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .record-label .dot {
            width: 10px; height: 10px;
            border-radius: 50%;
        }
        .record-label .dot.start { background: #7BA17B; }
        .record-label .dot.end { background: #C4A882; }
        .record-value {
            font-size: 20px;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            color: #3E3933;
        }
        .duration {
            margin: 16px 0 8px;
            padding: 14px;
            background: #FAF6EE;
            border-radius: 16px;
            text-align: center;
            font-size: 15px;
            color: #8A7F6F;
        }
        .duration strong {
            color: #5F7D5B;
            font-size: 21px;
            font-weight: 700;
        }
        .history-item {
            padding: 14px 2px;
            border-bottom: 1px solid #F3EDE2;
        }
        .history-item:last-child { border-bottom: none; }
        .history-date {
            font-size: 14px;
            color: #B5AB9C;
            margin-bottom: 6px;
        }
        .history-times {
            display: flex;
            gap: 24px;
            font-size: 16px;
            color: #6B6153;
        }
        .empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            padding: 36px 0 28px;
        }
        .empty .art {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: #FAF6EE;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }
        .empty .text {
            color: #C0B6A6;
            font-size: 15px;
        }

        .toast {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(62,57,51,0.92);
            color: white;
            padding: 16px 30px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 500;
            opacity: 0;
            transition: opacity 0.25s;
            pointer-events: none;
            z-index: 100;
            letter-spacing: 1px;
        }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>
    <div class="container">
        <!-- 时间卡片 -->
        <div class="time-card">
            <div class="date-line" id="currentDate"></div>
            <div class="clock-time" id="currentTime">--:--</div>
            <div class="status-pill" id="statusLabel">等待打卡</div>
        </div>

        <!-- 按钮 -->
        <div class="buttons">
            <button class="btn btn-start" id="btnStart" onclick="clockIn()">
                <span class="icon">☀</span>
                <span>上班打卡</span>
            </button>
            <button class="btn btn-end" id="btnEnd" onclick="clockOut()">
                <span class="icon">☾</span>
                <span>下班打卡</span>
            </button>
        </div>

        <!-- 记录 -->
        <div class="records">
            <div class="records-head">
                <h3>最近记录</h3>
                <span class="count" id="recordCount"></span>
            </div>
            <div id="todayContent"></div>
            <div class="duration" id="durationBox" style="display:none"></div>
            <div id="historyList">
                <div class="empty">
                    <div class="art">🕐</div>
                    <div class="text">还没有打卡记录</div>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        function getToday() { return new Date().toISOString().split('T')[0]; }
        function formatTime(d) { return new Date(d).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }); }
        function formatDate(ds) {
            const d = new Date(ds), t = new Date(getToday());
            const y = new Date(t); y.setDate(y.getDate() - 1);
            if (ds === getToday()) return '今天';
            if (ds === y.toISOString().split('T')[0]) return '昨天';
            return `${d.getMonth()+1}月${d.getDate()}日`;
        }
        function getRecords() { return JSON.parse(localStorage.getItem('clockRecords') || '{}'); }
        function saveRecords(r) { localStorage.setItem('clockRecords', JSON.stringify(r)); }
        function getTodayRecord() { return getRecords()[getToday()] || null; }

        function clockIn() {
            const records = getRecords(), today = getToday();
            if (records[today] && records[today].start) { showToast('今天已经打过上班卡了'); return; }
            records[today] = { ...records[today], start: new Date().toISOString() };
            saveRecords(records);
            showToast('上班打卡成功');
            updateUI();
        }
        function clockOut() {
            const records = getRecords(), today = getToday();
            if (!records[today] || !records[today].start) { showToast('请先打上班卡'); return; }
            if (records[today].end) { showToast('今天已经打过下班卡了'); return; }
            records[today].end = new Date().toISOString();
            saveRecords(records);
            showToast('下班打卡成功');
            updateUI();
        }
        function calcDuration(s, e) {
            if (!s || !e) return null;
            const ms = new Date(e) - new Date(s);
            return `${Math.floor(ms/3600000)}小时${Math.floor((ms%3600000)/60000)}分钟`;
        }

        function updateUI() {
            const rec = getTodayRecord();
            const content = document.getElementById('todayContent');
            const dur = document.getElementById('durationBox');
            const label = document.getElementById('statusLabel');
            const btnS = document.getElementById('btnStart');
            const btnE = document.getElementById('btnEnd');

            if (rec) {
                let h = '';
                if (rec.start) h += `<div class="record-row"><div class="record-label"><span class="dot start"></span>上班</div><div class="record-value">${formatTime(rec.start)}</div></div>`;
                if (rec.end) h += `<div class="record-row"><div class="record-label"><span class="dot end"></span>下班</div><div class="record-value">${formatTime(rec.end)}</div></div>`;
                content.innerHTML = h;
                if (rec.start && rec.end) {
                    dur.style.display = 'block';
                    dur.innerHTML = `今日工作时长 <strong>${calcDuration(rec.start, rec.end)}</strong>`;
                    label.textContent = '今日已完成';
                    label.className = 'status-pill done';
                    btnS.disabled = true; btnE.disabled = true;
                } else {
                    label.textContent = '工作中';
                    label.className = 'status-pill working';
                    btnS.disabled = true; btnE.disabled = false;
                    dur.style.display = 'none';
                }
            } else {
                content.innerHTML = '';
                label.textContent = '等待打卡';
                label.className = 'status-pill';
                btnS.disabled = false; btnE.disabled = false;
                dur.style.display = 'none';
            }
            updateHistory();
        }

        function updateHistory() {
            const records = getRecords();
            const dates = Object.keys(records).sort().reverse().slice(0, 7);
            const el = document.getElementById('historyList');
            const cnt = document.getElementById('recordCount');
            cnt.textContent = dates.length ? `${dates.length} 天` : '';
            if (!dates.length) {
                el.innerHTML = '<div class="empty"><div class="art">🕐</div><div class="text">还没有打卡记录</div></div>';
                return;
            }
            let h = '';
            dates.forEach(d => {
                const r = records[d];
                h += `<div class="history-item"><div class="history-date">${formatDate(d)}</div><div class="history-times">
                    <span>上班 ${formatTime(r.start)}</span>
                    ${r.end ? `<span>下班 ${formatTime(r.end)}</span>` : '<span style="color:#C0B6A6">未打下班卡</span>'}
                </div></div>`;
            });
            el.innerHTML = h;
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 1500);
        }

        function updateClock() {
            const now = new Date();
            document.getElementById('currentTime').textContent =
                now.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            document.getElementById('currentDate').textContent =
                now.toLocaleDateString('zh-CN', { month: 'long', day: 'numeric', weekday: 'long' });
        }

        updateClock(); setInterval(updateClock, 1000); updateUI();
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(rs => { for(let r of rs) r.unregister(); });
            navigator.serviceWorker.register('sw.js?t=' + Date.now()).catch(() => {});
        }
    </script>
</body>
</html>
