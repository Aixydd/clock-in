<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#F6F1E7">
    <title>上下班打卡</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body { height: 100%; overflow: hidden; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #F6F1E7;
            color: #3E3933;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 18px;
            gap: 16px;
        }

        /* ========== 顶部三分之一：时间 ========== */
        .time-card {
            position: relative;
            background: linear-gradient(180deg, #FFFFFF 0%, #FDF8EF 45%, #E4EDDF 100%);
            border-radius: 28px;
            box-shadow: 0 6px 24px rgba(120,100,70,0.08);
            height: 33vh;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 20px;
            border: 1px solid #F0E8D8;
            overflow: hidden;
        }
        .forest {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 42%;
            pointer-events: none;
            z-index: 0;
        }
        .date-line, .clock-time, .status-pill {
            position: relative;
            z-index: 1;
        }
        .mascot {
            position: absolute;
            width: min(28vw, 180px);
            height: min(28vw, 180px);
            border-radius: 50%;
            object-fit: cover;
            object-position: center 28%;
            border: 3px solid #FFFFFF;
            box-shadow: 0 4px 14px rgba(120,100,70,0.3);
            pointer-events: none;
            z-index: 2;
        }
        .time-card .mascot {
            top: -28px;
            left: 14px;
        }
        .date-line {
            font-size: 22px;
            color: #8F8575;
            letter-spacing: 1px;
            margin-bottom: 12px;
            font-weight: 500;
        }
        .clock-time {
            font-size: min(34vw, 160px);
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            letter-spacing: 2px;
            color: #332D26;
            line-height: 1.1;
        }
        .status-pill {
            display: inline-block;
            margin-top: 18px;
            padding: 12px 30px;
            border-radius: 999px;
            background: #F3EDE2;
            color: #8A7F6F;
            font-size: 20px;
            letter-spacing: 2px;
            font-weight: 500;
        }
        .status-pill.working {
            background: #E8F0E4;
            color: #5F7D5B;
        }
        .status-pill.done {
            background: #EDE6D8;
            color: #8A7355;
        }

        /* ========== 中间：按钮 ========== */
        .buttons {
            display: flex;
            gap: 14px;
            flex-shrink: 0;
        }
        .btn {
            flex: 1;
            padding: 42px 16px;
            border: none;
            border-radius: 30px;
            font-size: 30px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
            letter-spacing: 2px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            color: #FFFFFF;
        }
        .btn .icon { font-size: 46px; line-height: 1; }
        .btn:active { transform: scale(0.95); filter: brightness(0.94); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; filter: none; }
        .btn-start {
            background: linear-gradient(160deg, #86A988 0%, #6E926F 100%);
            box-shadow: 0 6px 16px rgba(110,146,111,0.3);
        }
        .btn-end {
            background: linear-gradient(160deg, #CDB391 0%, #B99A74 100%);
            box-shadow: 0 6px 16px rgba(185,154,116,0.3);
        }

        /* ========== 底部：记录（自动填满） ========== */
        .records {
            position: relative;
            background: linear-gradient(180deg, #FFFFFF 0%, #FDFAF3 100%);
            border-radius: 28px;
            box-shadow: 0 6px 24px rgba(120,100,70,0.08);
            border: 1px solid #F0E8D8;
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 22px 22px 16px;
            display: flex;
            flex-direction: column;
        }
        .records .mascot {
            top: -28px;
            right: 30vw;
        }
        .records-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            flex-shrink: 0;
        }
        .records-head h3 {
            font-size: 24px;
            font-weight: 600;
            color: #6B6153;
            letter-spacing: 2px;
        }
        .records-head .count {
            font-size: 18px;
            color: #B5AB9C;
        }
        #historyList {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .record-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 2px;
            border-bottom: 1px solid #F3EDE2;
        }
        .record-label {
            font-size: 24px;
            color: #6B6153;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .record-label .dot {
            width: 14px; height: 14px;
            border-radius: 50%;
        }
        .record-label .dot.start { background: #7BA17B; }
        .record-label .dot.end { background: #C4A882; }
        .record-value {
            font-size: 28px;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            color: #3E3933;
        }
        .duration {
            margin: 14px 0 8px;
            padding: 16px;
            background: #FAF6EE;
            border-radius: 16px;
            text-align: center;
            font-size: 20px;
            color: #8A7F6F;
            flex-shrink: 0;
        }
        .duration strong {
            color: #5F7D5B;
            font-size: 28px;
            font-weight: 700;
        }
        .history-item {
            padding: 14px 2px;
            border-bottom: 1px solid #F3EDE2;
        }
        .history-item:last-child { border-bottom: none; }
        .history-date {
            font-size: 20px;
            color: #B5AB9C;
            margin-bottom: 6px;
        }
        .history-times {
            display: flex;
            gap: 22px;
            font-size: 24px;
            color: #6B6153;
        }
        .empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex: 1;
            min-height: 140px;
            padding: 16px 0;
        }
        .empty .art {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: #FAF6EE;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 56px;
        }
        .empty .text {
            color: #9A9080;
            font-size: 24px;
            font-weight: 500;
        }
        .empty .hint {
            color: #C8BEAE;
            font-size: 18px;
        }

        .toast {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(62,57,51,0.92);
            color: white;
            padding: 16px 30px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 500;
            opacity: 0;
            transition: opacity 0.25s;
            pointer-events: none;
            z-index: 100;
            letter-spacing: 1px;
        }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>
    <div class="container">
        <!-- 顶部三分之一：时间 -->
        <div class="time-card">
            <svg class="forest" viewBox="0 0 400 140" preserveAspectRatio="xMidYMax slice">
                <!-- 远景树（浅绿） -->
                <g fill="#D5E3CD" opacity="0.85">
                    <path d="M18 140 L44 62 L70 140 Z"/>
                    <path d="M330 140 L356 55 L382 140 Z"/>
                    <circle cx="118" cy="108" r="20"/>
                    <circle cx="118" cy="92" r="16"/>
                    <rect x="115" y="118" width="6" height="22" fill="#C9B58F"/>
                </g>
                <!-- 中景树（中绿） -->
                <g fill="#B7CFA9">
                    <path d="M80 140 L108 35 L136 140 Z"/>
                    <path d="M268 140 L298 48 L328 140 Z"/>
                    <path d="M190 140 L214 80 L238 140 Z"/>
                </g>
                <!-- 近景树（深绿） -->
                <g fill="#93B489">
                    <path d="M140 140 L170 18 L200 140 Z"/>
                    <path d="M52 140 L76 72 L100 140 Z"/>
                    <path d="M310 140 L336 68 L362 140 Z"/>
                    <circle cx="240" cy="100" r="24"/>
                    <circle cx="240" cy="80" r="19"/>
                    <rect x="236" y="112" width="8" height="28" fill="#A98F6B"/>
                </g>
                <!-- 地面 -->
                <path d="M0 128 Q60 118 130 126 T270 124 T400 126 L400 140 L0 140 Z" fill="#A9C49C"/>
                <path d="M0 136 Q100 130 200 135 T400 134 L400 140 L0 140 Z" fill="#8FB182"/>
            </svg>
            <img class="mascot" src="gif1.gif" alt="角色">
            <div class="date-line" id="currentDate"></div>
            <div class="clock-time" id="currentTime">--:--</div>
            <div class="status-pill" id="statusLabel">等待打卡</div>
        </div>

        <!-- 中间：按钮 -->
        <div class="buttons">
            <button class="btn btn-start" id="btnStart" onclick="clockIn()">
                <span class="icon">☀</span>
                <span>上班打卡</span>
            </button>
            <button class="btn btn-end" id="btnEnd" onclick="clockOut()">
                <span class="icon">☾</span>
                <span>下班打卡</span>
            </button>
        </div>

        <!-- 底部：记录 -->
        <div class="records">
            <img class="mascot" src="gif2.gif" alt="角色">
            <div class="records-head">
                <h3>最近记录</h3>
                <span class="count" id="recordCount"></span>
            </div>
            <div id="todayContent"></div>
            <div class="duration" id="durationBox" style="display:none"></div>
            <div id="historyList">
                <div class="empty">
                    <div class="art">🕐</div>
                    <div class="text">还没有打卡记录</div>
                    <div class="hint">点击上方按钮开始打卡吧</div>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        function getToday() { return new Date().toISOString().split('T')[0]; }
        function formatTime(d) { return new Date(d).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }); }
        function formatDate(ds) {
            const d = new Date(ds), t = new Date(getToday());
            const y = new Date(t); y.setDate(y.getDate() - 1);
            if (ds === getToday()) return '今天';
            if (ds === y.toISOString().split('T')[0]) return '昨天';
            return `${d.getMonth()+1}月${d.getDate()}日`;
        }
        function getRecords() { return JSON.parse(localStorage.getItem('clockRecords') || '{}'); }
        function saveRecords(r) { localStorage.setItem('clockRecords', JSON.stringify(r)); }
        function getTodayRecord() { return getRecords()[getToday()] || null; }

        // 兼容旧数据格式：{start, end} → [{start, end}]
        function toSessions(rec) {
            if (!rec) return [];
            if (rec.sessions) return rec.sessions;
            return [{ start: rec.start || null, end: rec.end || null }];
        }

        const MAX_SESSIONS = 3; // 每天 3 组上下班

        function clockIn() {
            const records = getRecords(), today = getToday();
            const day = records[today] || { sessions: [] };
            const sessions = day.sessions || [];
            if (sessions.length >= MAX_SESSIONS) {
                showToast(`今天已打满 ${MAX_SESSIONS} 次上班卡`);
                return;
            }
            const last = sessions[sessions.length - 1];
            if (last && !last.end) { showToast('请先打下班卡'); return; }
            sessions.push({ start: new Date().toISOString(), end: null });
            day.sessions = sessions;
            records[today] = day;
            saveRecords(records);
            showToast(`第 ${sessions.length} 次上班打卡成功`);
            updateUI();
        }
        function clockOut() {
            const records = getRecords(), today = getToday();
            const day = records[today];
            const sessions = day ? (day.sessions || []) : [];
            if (!sessions.length) { showToast('请先打上班卡'); return; }
            const last = sessions[sessions.length - 1];
            if (last.end) { showToast('请先打上班卡'); return; }
            last.end = new Date().toISOString();
            saveRecords(records);
            const completed = sessions.length >= MAX_SESSIONS && sessions.every(s => s.start && s.end);
            showToast(completed ? '下班打卡成功，今日全部完成！' : `第 ${sessions.length} 次下班打卡成功`);
            updateUI();
        }
        function calcTotalDuration(sessions) {
            let ms = 0;
            sessions.forEach(s => { if (s.start && s.end) ms += new Date(s.end) - new Date(s.start); });
            return `${Math.floor(ms/3600000)}小时${Math.floor((ms%3600000)/60000)}分钟`;
        }

        function updateUI() {
            const rec = getTodayRecord();
            const content = document.getElementById('todayContent');
            const dur = document.getElementById('durationBox');
            const label = document.getElementById('statusLabel');
            const btnS = document.getElementById('btnStart');
            const btnE = document.getElementById('btnEnd');

            const sessions = toSessions(rec);

            if (sessions.length) {
                let h = '';
                sessions.forEach((s, i) => {
                    const num = sessions.length > 1 ? i + 1 : '';
                    h += `<div class="record-row"><div class="record-label"><span class="dot start"></span>上班${num}</div><div class="record-value">${formatTime(s.start)}</div></div>`;
                    if (s.end) h += `<div class="record-row"><div class="record-label"><span class="dot end"></span>下班${num}</div><div class="record-value">${formatTime(s.end)}</div></div>`;
                });
                content.innerHTML = h;

                const completed = sessions.length >= MAX_SESSIONS && sessions.every(s => s.start && s.end);
                const hasOpen = sessions.some(s => s.start && !s.end);

                if (completed) {
                    // 最后一次打卡后自动计算今日上班总时长
                    dur.style.display = 'block';
                    dur.innerHTML = `今日工作时长 <strong>${calcTotalDuration(sessions)}</strong>`;
                    label.textContent = '今日已完成';
                    label.className = 'status-pill done';
                    btnS.disabled = true; btnE.disabled = true;
                } else if (hasOpen) {
                    label.textContent = `工作中 · 第 ${sessions.length} 次`;
                    label.className = 'status-pill working';
                    btnS.disabled = true; btnE.disabled = false;
                    dur.style.display = 'none';
                } else {
                    label.textContent = `已完成 ${sessions.length}/${MAX_SESSIONS} 次`;
                    label.className = 'status-pill';
                    btnS.disabled = false; btnE.disabled = false;
                    dur.style.display = 'none';
                }
            } else {
                content.innerHTML = '';
                label.textContent = '等待打卡';
                label.className = 'status-pill';
                btnS.disabled = false; btnE.disabled = false;
                dur.style.display = 'none';
            }
            updateHistory();
        }

        function updateHistory() {
            const records = getRecords();
            const dates = Object.keys(records).sort().reverse().slice(0, 7);
            const el = document.getElementById('historyList');
            const cnt = document.getElementById('recordCount');
            cnt.textContent = dates.length ? `${dates.length} 天` : '';
            if (!dates.length) {
                el.innerHTML = '<div class="empty"><div class="art">🕐</div><div class="text">还没有打卡记录</div><div class="hint">点击上方按钮开始打卡吧</div></div>';
                return;
            }
            let h = '';
            dates.forEach(d => {
                const r = records[d];
                const sessions = toSessions(r);
                if (!sessions.length) return;
                h += `<div class="history-item"><div class="history-date">${formatDate(d)}</div>`;
                sessions.forEach((s, i) => {
                    const num = sessions.length > 1 ? i + 1 : '';
                    h += `<div class="history-times">
                        <span>上班${num} ${formatTime(s.start)}</span>
                        ${s.end ? `<span>下班${num} ${formatTime(s.end)}</span>` : '<span style="color:#C0B6A6">未打下班卡</span>'}
                    </div>`;
                });
                const allDone = sessions.length >= MAX_SESSIONS && sessions.every(s => s.start && s.end);
                if (allDone) h += `<div class="history-times" style="color:#5F7D5B;font-weight:600;margin-top:4px"><span>总时长 ${calcTotalDuration(sessions)}</span></div>`;
                h += '</div>';
            });
            el.innerHTML = h || '<div class="empty"><div class="art">🕐</div><div class="text">还没有打卡记录</div><div class="hint">点击上方按钮开始打卡吧</div></div>';
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 1500);
        }

        function updateClock() {
            const now = new Date();
            document.getElementById('currentTime').textContent =
                now.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            document.getElementById('currentDate').textContent =
                now.toLocaleDateString('zh-CN', { month: 'long', day: 'numeric', weekday: 'long' });
        }

        updateClock(); setInterval(updateClock, 1000); updateUI();
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(rs => { for(let r of rs) r.unregister(); });
            navigator.serviceWorker.register('sw.js?t=' + Date.now()).catch(() => {});
        }
    </script>
</body>
</html>
