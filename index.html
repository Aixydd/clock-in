<!DOCTYPE html>
<html lang="zh-CN" data-theme="">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#F6F1E7">
    <title>上下班打卡</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --bg: #F6F1E7;
            --card: #FFFFFF;
            --card2: #FAF6EE;
            --card3: #F3EDE2;
            --ink: #332D26;
            --ink2: #6B6153;
            --muted: #8A7F6F;
            --faint: #B5AB9C;
            --line: #F0E8D8;
            --line2: #E8E0D0;
            --green: #6E926F;
            --green-bg: #E8F0E4;
            --green-ink: #5F7D5B;
            --brown: #B99A74;
            --brown-bg: #EDE6D8;
            --brown-ink: #8A7355;
            --blue: #5B7199;
            --blue-bg: #E5ECF6;
            --warn: #8A6D20;
            --warn-bg: #FCF6E6;
            --warn-line: #D9B45B;
            --shadow: 0 6px 24px rgba(120, 100, 70, 0.08);
            --r-card: 24px;
            --r-ctl: 16px;
            --r-pill: 999px;

            /* 自适应尺寸基准：随视口高度/宽度伸缩，避免固定 px 在瘦高屏上头重脚轻 */
            --avatar: clamp(68px, 10.5vh, 100px);
            --pad-t: clamp(14px, 2.4vh, 24px);
            --pad-b: clamp(16px, 2.6vh, 26px);
            --kbd: 0px;
        }

        html[data-sys="dark"]:not([data-theme]),
        html[data-theme="dark"] {
            --bg: #1E1B17;
            --card: #2A2620;
            --card2: #332E27;
            --card3: #3A352D;
            --ink: #F2EBDE;
            --ink2: #C9BFAE;
            --muted: #A79C8B;
            --faint: #7E7466;
            --line: #3A342C;
            --line2: #453E35;
            --green: #84AF87;
            --green-bg: #34452F;
            --green-ink: #A8CBA4;
            --brown: #C4A882;
            --brown-bg: #453B2E;
            --brown-ink: #D6BC94;
            --blue: #8CA6D0;
            --blue-bg: #2E3949;
            --warn: #E0BE6B;
            --warn-bg: #453A22;
            --warn-line: #8A6D20;
            --shadow: 0 6px 24px rgba(0, 0, 0, 0.28);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            overflow: hidden;
            overscroll-behavior: none;
            background: var(--bg);
        }
        @supports (height: 100dvh) { html, body { height: 100dvh; } }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            color: var(--ink);
            -webkit-font-smoothing: antialiased;
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
            transition: background .3s, color .3s;
        }

        .container {
            width: 100%; min-width: 0;
            position: fixed;
            inset: 0;
            /* JS 会把 window.innerHeight 写进 --vh，这里做兜底 */
            height: calc(var(--vh, 1vh) * 100);
            display: flex; flex-direction: column;
            gap: 8px;
            padding: calc(6px + env(safe-area-inset-top)) 12px calc(6px + env(safe-area-inset-bottom));
            background: var(--bg);
        }

        .topbar { display: flex; align-items: center; justify-content: space-between; padding: 0 2px; gap: 8px; min-height: 36px; }
        .appname { font-size: clamp(17px, 5vw, 21px); font-weight: 700; color: var(--ink); letter-spacing: 1px; white-space: nowrap; }
        .icon-btn {
            width: clamp(38px, 10vw, 44px); height: clamp(38px, 10vw, 44px); flex-shrink: 0;
            border: none; border-radius: var(--r-pill);
            background: var(--card); color: var(--ink2);
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            transition: transform .15s;
        }
        .icon-btn svg { width: 20px; height: 20px; }
        .icon-btn:active { transform: scale(0.92); }
        .top-left { display: flex; align-items: center; gap: 8px; min-width: 0; }
        .holiday-toggle {
            display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
            padding: 7px 12px; border: none; border-radius: var(--r-pill);
            background: var(--card); color: var(--muted);
            font-size: clamp(12px, 3.4vw, 14px); font-weight: 600; cursor: pointer;
            transition: background .18s, color .18s, transform .15s;
        }
        .holiday-toggle .dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--faint); transition: background .2s;
        }
        .holiday-toggle.on { background: var(--blue-bg); color: var(--blue); }
        .holiday-toggle.on .dot { background: var(--blue); }
        .holiday-toggle:active { transform: scale(0.94); }

        /* 两页通用：flex 兜底；JS 会在可用空间里按百分比精确分配像素高度 */
        .page {
            flex: 1; min-height: 0;
            display: flex; flex-direction: column;
            gap: 8px;
            overflow: hidden;
        }
        .page[hidden] { display: none; }
        /* 打卡页：时间卡 42% / 按钮 14% / 记录区 44% */
        #pageClock > .time-card { flex: 0 0 42%; min-height: 0; }
        #pageClock > .buttons { flex: 0 0 14%; min-height: 0; }
        #pageClock > .records { flex: 1; min-height: 0; }
        /* 日历页：日历卡 64% / 图例 5% / 详情 31%（JS 会按选中状态微调） */
        #pageCalendar > .cal-card { flex: 0 0 64%; min-height: 0; }
        #pageCalendar > .cal-legend { flex: 0 0 5%; min-height: 0; }
        #pageCalendar > .cal-detail { flex: 1; min-height: 0; }

        /* 时间卡 */
        .time-card {
            position: relative; background: var(--card); border-radius: var(--r-card);
            box-shadow: var(--shadow);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: var(--pad-t) 18px var(--pad-b); border: 1px solid var(--line); overflow: hidden;
            transition: background .3s, border-color .3s;
        }
        .date-line, .clock-time, .status-pill { position: relative; z-index: 1; }
        .avatar {
            width: var(--avatar); height: var(--avatar);
            border-radius: 50%;
            object-fit: cover; object-position: center 28%;
            border: 3px solid var(--card);
            box-shadow: 0 5px 14px rgba(120, 100, 70, 0.15);
            background: var(--card3);
            margin-bottom: clamp(8px, 1.6vh, 14px);
            position: relative; z-index: 1;
            transition: box-shadow .3s;
        }
        .avatar.on-holiday { box-shadow: 0 0 0 3px var(--blue), 0 5px 14px rgba(90, 130, 190, 0.28); }
        .speech {
            position: absolute;
            left: 50%; top: calc(var(--pad-t) + var(--avatar));
            transform: translateX(-50%) translateY(-6px);
            background: var(--card3); color: var(--ink2);
            font-size: 13px; font-weight: 600; letter-spacing: .5px;
            padding: 7px 12px; border-radius: 14px;
            opacity: 0; pointer-events: none; z-index: 3;
            white-space: nowrap; max-width: 90%; overflow: hidden; text-overflow: ellipsis;
            transition: opacity .3s, transform .3s;
        }
        .speech.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .date-line { font-size: clamp(15px, 4.5vw, 19px); color: var(--muted); letter-spacing: 1px; margin-bottom: 5px; font-weight: 500; }
        .clock-time {
            font-size: clamp(50px, 19vw, 92px); font-weight: 700;
            font-variant-numeric: tabular-nums; letter-spacing: 1px; color: var(--ink); line-height: 1.05;
        }
        .status-pill {
            display: inline-flex; align-items: center; gap: 6px; margin-top: clamp(8px, 1.8vh, 15px);
            padding: 7px 17px; border-radius: var(--r-pill);
            background: var(--card3); color: var(--muted);
            font-size: clamp(15px, 4.4vw, 18px); letter-spacing: 1px; font-weight: 600;
        }
        .status-pill.working { background: var(--green-bg); color: var(--green-ink); }
        .status-pill.done { background: var(--brown-bg); color: var(--brown-ink); }
        .status-pill.holiday { background: var(--blue-bg); color: var(--blue); }
        .holiday-info { text-align: center; font-size: 18px; color: var(--muted); letter-spacing: 1px; padding: 16px 0; }

        /* 按钮 */
        .buttons { display: flex; gap: clamp(10px, 3vw, 14px); }
        .btn {
            flex: 1; min-width: 0; padding: clamp(14px, 2.6vh, 24px) 12px; border: none; border-radius: var(--r-card);
            font-size: clamp(17px, 5vw, 21px); font-weight: 600; cursor: pointer;
            transition: transform .15s, filter .15s, opacity .15s;
            letter-spacing: 1px; display: flex; flex-direction: column;
            align-items: center; gap: 6px; color: #FFFFFF;
        }
        .btn svg { width: clamp(24px, 7vw, 30px); height: clamp(24px, 7vw, 30px); }
        .btn span { white-space: nowrap; }
        .btn:active { transform: scale(0.96); filter: brightness(0.94); }
        .btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; filter: none; }
        .btn-start { background: var(--green); }
        .btn-end { background: var(--brown); }

        /* 记录：固定占页面的 47%，内部再分 “标题”+“内容体” */
        .records {
            position: relative; background: var(--card); border-radius: var(--r-card);
            box-shadow: var(--shadow); border: 1px solid var(--line);
            min-height: 0; overflow: hidden;
            padding: clamp(12px, 2vh, 18px) clamp(12px, 3.6vw, 16px) clamp(10px, 1.8vh, 16px);
            display: flex; flex-direction: column; transition: background .3s, border-color .3s;
        }
        .records-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; flex-shrink: 0; }
        .records-head h3 { font-size: 20px; font-weight: 700; color: var(--ink2); letter-spacing: 2px; }
        .records-head .count { font-size: 14px; color: var(--faint); }
        .records-body {
            flex: 1; min-height: 0;
            display: flex; flex-direction: column;
            overflow-y: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none;
        }
        .records-body::-webkit-scrollbar { display: none; }

        .record-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 2px; border-bottom: 1px solid var(--line);
        }
        .record-label { font-size: 18px; color: var(--ink2); display: flex; align-items: center; gap: 10px; }
        .record-label .dot { width: 9px; height: 9px; border-radius: 50%; }
        .record-label .dot.start { background: var(--green); }
        .record-label .dot.end { background: var(--brown); }
        .record-value { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--ink); }
        .duration {
            margin: 10px 0 4px; padding: 14px; background: var(--card2);
            border-radius: var(--r-ctl); text-align: center; font-size: 15px;
            color: var(--muted); flex-shrink: 0;
        }
        .duration strong { color: var(--green-ink); font-size: 22px; font-weight: 700; }
        .history-item { padding: 11px 2px; border-bottom: 1px solid var(--line); }
        .history-item:last-child { border-bottom: none; }
        .history-date { font-size: 14px; color: var(--faint); margin-bottom: 4px; }
        .history-times { display: flex; gap: 16px; font-size: 16px; color: var(--ink2); }
        .empty {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 10px; flex: 1; min-height: 120px; padding: 18px 0;
        }
        .empty .art {
            width: 80px; height: 80px; border-radius: 50%; background: var(--card2);
            display: flex; align-items: center; justify-content: center;
        }
        .empty .art svg { width: 40px; height: 40px; color: var(--muted); }
        .empty .text { color: var(--muted); font-size: 17px; font-weight: 600; }
        .empty .hint { color: var(--faint); font-size: 14px; }
        .undo-btn {
            width: 100%; padding: 14px; border: 1px solid var(--line2);
            border-radius: var(--r-ctl); background: var(--card); color: var(--muted);
            font-size: 15px; font-weight: 600; letter-spacing: 1px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 7px;
            flex-shrink: 0; transition: all .15s;
        }
        .undo-btn svg { width: 18px; height: 18px; }
        .undo-btn:active { transform: scale(0.97); background: var(--card2); }
        .undo-btn.armed { border-color: var(--warn-line); background: var(--warn-bg); color: var(--warn); }

        /* 日历 */
        .cal-card {
            background: var(--card); border-radius: var(--r-card); box-shadow: var(--shadow);
            border: 1px solid var(--line); padding: 16px 14px 14px;
            transition: background .3s, border-color .3s;
            display: flex; flex-direction: column; min-height: 0;
        }
        .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; flex-shrink: 0; }
        .cal-title { font-size: clamp(19px, 5.5vw, 23px); font-weight: 700; color: var(--ink); letter-spacing: 1px; }
        .cal-navs { display: flex; gap: 8px; }
        .cal-nav {
            width: clamp(32px, 8vw, 38px); height: clamp(32px, 8vw, 38px); border: none; border-radius: var(--r-pill);
            background: var(--card2); color: var(--ink2);
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            transition: transform .15s;
        }
        .cal-nav svg { width: 16px; height: 16px; }
        .cal-nav:active { transform: scale(0.9); }
        .cal-week { display: grid; grid-template-columns: repeat(7, 1fr); margin-bottom: 4px; flex-shrink: 0; }
        .cal-week span { text-align: center; font-size: 13px; color: var(--faint); padding: 4px 0; font-weight: 600; }
        .cal-week span.we { color: var(--brown); }
        .cal-grid { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
        .cal-cell {
            position: relative; border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            font-size: clamp(15px, 4.6vw, 18px); font-variant-numeric: tabular-nums; color: var(--ink2);
            background: transparent; border: 1.5px solid transparent; cursor: pointer;
            transition: transform .12s, background .2s, border-color .2s;
            -webkit-tap-highlight-color: transparent;
        }
        .cal-cell:active { transform: scale(0.9); }
        .cal-cell.empty { pointer-events: none; }
        .cal-cell.weekend { color: var(--brown); }
        .cal-cell.work { background: var(--green-bg); color: var(--green-ink); font-weight: 700; }
        .cal-cell.planned { border-color: var(--green); color: var(--green-ink); }
        .cal-cell.holiday { background: var(--blue-bg); color: var(--blue); font-weight: 700; }
        .cal-cell.rest { background: var(--card3); color: var(--muted); }
        .cal-cell.today { border-color: var(--ink); font-weight: 700; }
        .cal-cell.selected { transform: scale(1.06); box-shadow: 0 0 0 2px var(--ink); }
        .cal-cell .note-dot {
            position: absolute; bottom: 5px; left: 50%; transform: translateX(-50%);
            width: 4px; height: 4px; border-radius: 50%; background: currentColor; opacity: .65;
        }
        .cal-summary {
            margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--line);
            font-size: 13px; color: var(--muted); text-align: center; letter-spacing: .5px;
            flex-shrink: 0;
        }
        .cal-legend { display: flex; justify-content: center; gap: 12px; padding: 4px 0 0; }
        .cal-legend span { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); font-weight: 500; }
        .cal-legend i { width: 10px; height: 10px; border-radius: 3px; display: block; }
        .cal-legend i.work { background: var(--green-bg); box-shadow: inset 0 0 0 1px var(--green); }
        .cal-legend i.planned { border: 1.5px solid var(--green); background: transparent; }
        .cal-legend i.holiday { background: var(--blue-bg); box-shadow: inset 0 0 0 1px var(--blue); }
        .cal-legend i.rest { background: var(--card3); box-shadow: inset 0 0 0 1px var(--line2); }

        /* 日历详情：未选日期时显示本月概览，选中后显示当天详情 */
        .cal-detail {
            background: var(--card); border-radius: var(--r-card); box-shadow: var(--shadow);
            border: 1px solid var(--line); padding: 14px;
            display: flex; flex-direction: column; gap: 10px;
            transition: background .3s, border-color .3s;
            overflow-y: auto; min-height: 0;
        }
        .cal-detail.is-empty { gap: 14px; }
        .cal-detail .empty-art {
            width: 48px; height: 48px; border-radius: 50%; background: var(--card2);
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
            color: var(--muted);
        }
        .cal-detail .empty-art svg { width: 24px; height: 24px; }
        .detail-title { font-size: 18px; font-weight: 700; color: var(--ink); }
        .detail-sub { font-size: 13px; color: var(--muted); }
        .detail-box {
            background: var(--card2); border-radius: var(--r-ctl); padding: 12px 14px;
            font-size: 15px; color: var(--ink2); line-height: 1.5;
        }
        .detail-box .row { display: flex; justify-content: space-between; }
        .detail-box .row b { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--ink); }
        .detail-actions { display: flex; flex-direction: column; gap: 10px; margin-top: auto; }
        .btn-primary, .btn-ghost {
            width: 100%; padding: 15px; border-radius: var(--r-ctl);
            font-size: 16px; font-weight: 600; border: none; cursor: pointer;
            transition: transform .15s; letter-spacing: 1px;
        }
        .btn-primary { background: var(--green); color: #FFFFFF; }
        .btn-ghost { background: var(--card2); color: var(--muted); border: 1px solid var(--line2); }
        .btn-primary:active, .btn-ghost:active { transform: scale(0.97); }

        /* 弹层 */
        .sheet-mask {
            position: fixed; inset: 0; background: rgba(0, 0, 0, 0.38);
            opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 90;
        }
        .sheet-mask.show { opacity: 1; pointer-events: auto; }
        .sheet {
            position: fixed; left: 0; right: 0; bottom: var(--kbd);
            background: var(--card);
            border-radius: 24px 24px 0 0;
            padding: 14px 16px calc(20px + env(safe-area-inset-bottom));
            max-height: 86vh; max-height: 86dvh; overflow-y: auto; -webkit-overflow-scrolling: touch;
            transform: translateY(105%); transition: transform .28s cubic-bezier(.32, .72, 0, 1), bottom .18s ease-out;
            z-index: 100; display: flex; flex-direction: column; gap: 12px;
        }
        .sheet > * { flex-shrink: 0; }
        .sheet.show { transform: translateY(0); }
        .sheet-handle { width: 42px; height: 5px; border-radius: 3px; background: var(--line2); margin: 0 auto 4px; }
        .sheet-title { font-size: 19px; font-weight: 700; color: var(--ink); text-align: center; }
        .seg { display: flex; gap: 4px; background: var(--card2); padding: 4px; border-radius: var(--r-ctl); }
        .seg button {
            flex: 1; padding: 12px 0; border: none; border-radius: 14px;
            background: transparent; color: var(--muted);
            font-size: 15px; font-weight: 600; cursor: pointer; transition: all .18s;
        }
        .seg button.on { background: var(--card); color: var(--ink); box-shadow: 0 2px 8px rgba(0, 0, 0, .08); }
        .seg button.on[data-plan="holiday"] { color: var(--blue); }
        .seg button.on[data-plan="work"] { color: var(--green-ink); }
        .note-input {
            width: 100%; min-height: 76px; border: 1px solid var(--line2);
            border-radius: var(--r-ctl); background: var(--card2); color: var(--ink);
            font-family: inherit; font-size: 14px; padding: 11px 12px;
            resize: none; outline: none; line-height: 1.5;
        }
        .note-input:focus { border-color: var(--green); }
        .note-input::placeholder { color: var(--faint); }
        .sheet-actions { display: flex; gap: 10px; }
        .sheet-actions button { flex: 1; }

        /* 标签栏 */
        .tabbar {
            flex-shrink: 0; display: flex; gap: 4px; background: var(--card);
            border-radius: var(--r-card); box-shadow: var(--shadow);
            border: 1px solid var(--line); padding: 4px;
            transition: background .3s, border-color .3s;
        }
        .tab {
            flex: 1; height: clamp(48px, 7vh, 56px); border: none; border-radius: 18px;
            background: transparent; color: var(--muted);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 3px; font-size: clamp(12px, 3.6vw, 14px); font-weight: 600; cursor: pointer; transition: all .18s;
        }
        .tab svg { width: clamp(22px, 6vw, 26px); height: clamp(22px, 6vw, 26px); }
        .tab.on { background: var(--green-bg); color: var(--green-ink); }

        .toast {
            position: fixed; top: calc(60px + env(safe-area-inset-top)); left: 50%;
            transform: translateX(-50%) translateY(-12px);
            background: rgba(62, 57, 51, 0.94); color: #FFFFFF;
            padding: 11px 20px; border-radius: var(--r-ctl);
            font-size: 15px; font-weight: 500; opacity: 0;
            transition: opacity .25s, transform .25s;
            pointer-events: none; z-index: 120; letter-spacing: 1px;
            max-width: 84vw; text-align: center;
        }

        /* ===== 分档适配：按屏幕高度自动收紧，避免瘦高屏头重脚轻、矮屏被截断 ===== */
        @media (max-height: 780px) {
            :root { --avatar: clamp(56px, 9vh, 78px); }
            .clock-time { font-size: clamp(44px, 17vw, 74px); }
            .btn { font-size: clamp(16px, 4.8vw, 19px); }
        }
        @media (max-height: 660px) {
            :root { --avatar: clamp(48px, 8vh, 68px); --pad-t: 10px; --pad-b: 12px; }
            .container { gap: 6px; padding: calc(6px + env(safe-area-inset-top)) 10px calc(6px + env(safe-area-inset-bottom)); }
            .clock-time { font-size: clamp(40px, 15vw, 64px); }
            .btn { padding: 10px 12px; font-size: clamp(15px, 4.5vw, 18px); }
            .empty { min-height: 80px; padding: 8px 0; }
            .empty .art { width: 64px; height: 64px; }
            .records-head h3 { font-size: 18px; }
            .tab { height: clamp(42px, 6vh, 50px); }
        }
        /* 横屏 / 分屏：改为左右双列 */
        @media (orientation: landscape) and (max-height: 620px) {
            #pageClock { flex-direction: row; gap: 10px; }
            #pageClock > .time-card { flex: 0 0 42%; min-width: 0; }
            #pageClock > .buttons { flex: 0 0 14%; min-width: 0; flex-direction: column; }
            #pageClock > .records { flex: 1; min-width: 0; }
            #pageCalendar { flex-direction: row; gap: 10px; }
            #pageCalendar > .cal-card { flex: 1; min-width: 0; }
            #pageCalendar > .cal-legend { display: none; }
            #pageCalendar > .cal-detail { flex: 0 0 38%; min-width: 0; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="topbar">
            <div class="top-left">
                <div class="appname">上下班打卡</div>
                <button class="holiday-toggle" id="holidayToggle" onclick="toggleHoliday()">
                    <i class="dot"></i><span id="holidayToggleText">放假模式</span>
                </button>
            </div>
            <button class="icon-btn" onclick="toggleTheme()" aria-label="切换深浅色">
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
                </svg>
            </button>
        </div>

        <!-- 打卡页 -->
        <div class="page" id="pageClock">
            <div class="time-card">
                <img class="avatar" id="mascotAvatar" src="character_body.png" alt="角色">
                <div class="speech" id="mascotSpeech"></div>
                <div class="date-line" id="currentDate"></div>
                <div class="clock-time" id="currentTime">--:--</div>
                <div class="status-pill" id="statusLabel">等待打卡</div>
            </div>

            <div class="buttons">
                <button class="btn btn-start" id="btnStart" onclick="clockIn()">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="12" cy="12" r="5" fill="currentColor"/>
                        <path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.93 4.93l2.12 2.12M16.95 16.95l2.12 2.12M4.93 19.07l2.12-2.12M16.95 7.05l2.12-2.12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                    <span>上班打卡</span>
                </button>
                <button class="btn btn-end" id="btnEnd" onclick="clockOut()">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z" fill="currentColor"/>
                    </svg>
                    <span>下班打卡</span>
                </button>
            </div>

            <div class="records">
                <div class="records-head">
                    <h3>最近记录</h3>
                    <span class="count" id="recordCount"></span>
                </div>
                <div class="records-body">
                    <div id="todayContent"></div>
                    <div class="duration" id="durationBox" style="display:none"></div>
                    <button class="undo-btn" id="btnUndo" onclick="requestUndo()">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M4 9h9a5 5 0 0 1 0 10H8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                            <path d="M8 5L4 9l4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        <span id="undoText">撤销上一次打卡</span>
                    </button>
                    <div id="historyList"></div>
                </div>
            </div>
        </div>

        <!-- 日历页 -->
        <div class="page" id="pageCalendar" hidden>
            <div class="cal-card">
                <div class="cal-head">
                    <div class="cal-title" id="calTitle"></div>
                    <div class="cal-navs">
                        <button class="cal-nav" onclick="shiftMonth(-1)" aria-label="上个月">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        </button>
                        <button class="cal-nav" onclick="shiftMonth(0)" aria-label="回到本月">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3.2" fill="currentColor"/></svg>
                        </button>
                        <button class="cal-nav" onclick="shiftMonth(1)" aria-label="下个月">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 5l7 7-7 7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        </button>
                    </div>
                </div>
                <div class="cal-week">
                    <span class="we">日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span class="we">六</span>
                </div>
                <div class="cal-grid" id="calGrid"></div>
                <div class="cal-summary" id="calSummary"></div>
            </div>

            <div class="cal-legend">
                <span><i class="work"></i>已打卡</span>
                <span><i class="planned"></i>计划上班</span>
                <span><i class="holiday"></i>放假</span>
                <span><i class="rest"></i>休息</span>
            </div>

            <div class="cal-detail" id="calDetail"></div>
        </div>

        <nav class="tabbar">
            <button class="tab on" id="tabClock" onclick="switchTab('clock')">
                <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/><path d="M12 7v5.2l3.2 2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <span>打卡</span>
            </button>
            <button class="tab" id="tabCal" onclick="switchTab('cal')">
                <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="16" rx="4" stroke="currentColor" stroke-width="2"/><path d="M8 3v4M16 3v4M3 10h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                <span>日历</span>
            </button>
        </nav>
    </div>

    <div class="sheet-mask" id="sheetMask" onclick="closeSheet()"></div>
    <div class="sheet" id="daySheet">
        <div class="sheet-handle"></div>
        <div class="sheet-title" id="sheetTitle"></div>
        <div class="seg" id="planSeg">
            <button data-plan="work" onclick="setPlan('work')">上班</button>
            <button data-plan="rest" onclick="setPlan('rest')">休息</button>
            <button data-plan="holiday" onclick="setPlan('holiday')">放假</button>
        </div>
        <textarea class="note-input" id="noteInput" placeholder="这一天的安排，比如：上午评审、下午外勤…"></textarea>
        <div class="sheet-actions">
            <button class="btn-ghost" onclick="clearDay()">清除安排</button>
            <button class="btn-primary" onclick="saveDay()">保存</button>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        /* ===== 日期工具：全部基于本地时间，避免 UTC 偏移 ===== */
        function fmtDate(y, m, d) {
            return y + '-' + String(m + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
        }
        function getToday() {
            var n = new Date();
            return fmtDate(n.getFullYear(), n.getMonth(), n.getDate());
        }
        function parseKey(key) {
            var p = key.split('-').map(Number);
            return { y: p[0], m: p[1] - 1, d: p[2] };
        }
        function shiftDays(key, n) {
            var k = parseKey(key);
            var t = new Date(k.y, k.m, k.d + n);
            return fmtDate(t.getFullYear(), t.getMonth(), t.getDate());
        }
        function formatTime(d) {
            return new Date(d).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
        }
        function formatDate(ds) {
            var k = parseKey(ds);
            if (ds === getToday()) return '今天';
            if (ds === shiftDays(getToday(), -1)) return '昨天';
            return (k.m + 1) + '月' + k.d + '日';
        }
        function weekdayCN(key) {
            var k = parseKey(key);
            return '日一二三四五六'[new Date(k.y, k.m, k.d).getDay()];
        }

        /* ===== 存储 ===== */
        function getRecords() { return JSON.parse(localStorage.getItem('clockRecords') || '{}'); }
        function saveRecords(r) { localStorage.setItem('clockRecords', JSON.stringify(r)); }
        function getTodayRecord() { return getRecords()[getToday()] || null; }
        function toSessions(rec) {
            if (!rec) return [];
            if (rec.sessions) return rec.sessions;
            return [{ start: rec.start || null, end: rec.end || null }];
        }
        function hasClocks(rec) { return toSessions(rec).some(function (s) { return !!s.start; }); }
        function isHolidayRec(rec) { return !!(rec && (rec.holiday || rec.plan === 'holiday')); }

        /* ===== 数据迁移：旧版按 UTC 日期存 key，这里按打卡时刻的本地日期重新归档 =====
           迁移前会把原始数据完整备份到 clockRecordsBackup，随时可回滚 ===== */
        function migrateRecords() {
            var raw = localStorage.getItem('clockRecords');
            if (!raw) return 0;
            var records;
            try { records = JSON.parse(raw); } catch (e) { return 0; }
            var keys = Object.keys(records);
            if (!keys.length) return 0;

            var out = {};
            var moved = 0;
            var normalized = 0;

            keys.forEach(function (key) {
                var rec = records[key];
                if (!rec) return;
                var sessions;
                if (rec.sessions && rec.sessions.length) {
                    sessions = rec.sessions;
                } else if (rec.start || rec.end) {
                    sessions = [{ start: rec.start || null, end: rec.end || null }];
                    normalized++;
                } else {
                    sessions = [];
                }

                var kept = sessions.filter(function (s) { return s && s.start; });
                if (kept.length !== sessions.length) normalized++;

                // 用当天第一条打卡时刻的「本地日期」决定归属，跟新的 getToday() 保持一致
                var target = key;
                for (var i = 0; i < kept.length; i++) {
                    var d = new Date(kept[i].start);
                    target = fmtDate(d.getFullYear(), d.getMonth(), d.getDate());
                    break;
                }
                if (target !== key) moved++;

                if (!out[target]) out[target] = { sessions: [] };
                var cur = out[target];
                cur.sessions = cur.sessions.concat(kept);
                if (rec.holiday) cur.holiday = true;
                if (rec.plan) cur.plan = rec.plan;
                if (rec.note) cur.note = rec.note;
            });

            // 丢掉迁移后完全没有内容的占位记录
            Object.keys(out).forEach(function (k) {
                var r = out[k];
                if (!r.sessions.length && !r.holiday && !r.plan && !r.note) delete out[k];
            });

            if (moved > 0 || normalized > 0) {
                localStorage.setItem('clockRecordsBackup', raw);   // 迁移前的原始数据，留作回滚
                saveRecords(out);
            }
            return moved;
        }

        /* ===== Service Worker：先清掉旧的错误缓存，再注册网络优先版 ===== */
        function setupServiceWorker() {
            if (!('serviceWorker' in navigator)) return;
            var purged = localStorage.getItem('swPurgedV3');
            var prep = purged ? Promise.resolve() :
                navigator.serviceWorker.getRegistrations()
                    .then(function (rs) {
                        return Promise.all(rs.map(function (r) { return r.unregister(); }));
                    })
                    .then(function () {
                        if (!window.caches) return null;
                        return caches.keys().then(function (ks) {
                            return Promise.all(ks.map(function (k) { return caches.delete(k); }));
                        });
                    })
                    .then(function () { localStorage.setItem('swPurgedV3', '1'); });
            prep.then(function () {
                return navigator.serviceWorker.register('sw.js');
            }).catch(function () {});
        }

        var MAX_SESSIONS = 3;
        var lastState = null;
        var firstLoad = true;

        /* ===== 主题 ===== */
        var mq = window.matchMedia('(prefers-color-scheme: dark)');
        function applySysTheme() {
            document.documentElement.setAttribute('data-sys', mq.matches ? 'dark' : 'light');
            syncThemeColor();
        }
        function effectiveTheme() {
            var cur = document.documentElement.getAttribute('data-theme');
            if (cur === 'dark' || cur === 'light') return cur;
            return mq.matches ? 'dark' : 'light';
        }
        function syncThemeColor() {
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', effectiveTheme() === 'dark' ? '#1E1B17' : '#F6F1E7');
        }
        function initTheme() {
            var saved = localStorage.getItem('clockTheme');
            if (saved === 'dark' || saved === 'light') document.documentElement.setAttribute('data-theme', saved);
            applySysTheme();
        }
        function toggleTheme() {
            var next = effectiveTheme() === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('clockTheme', next);
            syncThemeColor();
            showToast(next === 'dark' ? '已切换到深色' : '已切换到浅色');
        }
        if (mq.addEventListener) mq.addEventListener('change', applySysTheme);

        /* ===== 状态 ===== */
        function getState() {
            var rec = getTodayRecord();
            if (isHolidayRec(rec)) return 'holiday';
            var sessions = toSessions(rec);
            if (sessions.length === 0) return 'idle';
            var completed = sessions.length >= MAX_SESSIONS && sessions.every(function (s) { return s.start && s.end; });
            var hasOpen = sessions.some(function (s) { return s.start && !s.end; });
            if (completed) return 'completed';
            if (hasOpen) return 'working';
            return 'rest';
        }
        function getMascotText(state) {
            var m = { 'holiday': '人，放假啦', 'working': '人，又上班了', 'rest': '人，上班辛苦了', 'completed': '人，上班辛苦了', 'idle': '' };
            return m[state] || '';
        }
        function showMascotText(text) {
            var el = document.getElementById('mascotSpeech');
            el.textContent = text;
            el.classList.add('show');
            setTimeout(function () { el.classList.remove('show'); }, 5000);
        }

        /* ===== 打卡 ===== */
        function clockIn() {
            var records = getRecords(), today = getToday();
            var day = records[today] || { sessions: [] };
            if (isHolidayRec(day)) { showToast('今天放假，无需打卡'); return; }
            var sessions = day.sessions || [];
            if (sessions.length >= MAX_SESSIONS) { showToast('今天已打满 ' + MAX_SESSIONS + ' 次上班卡'); return; }
            var last = sessions[sessions.length - 1];
            if (last && !last.end) { showToast('请先打下班卡'); return; }
            sessions.push({ start: new Date().toISOString(), end: null });
            day.sessions = sessions;
            records[today] = day;
            saveRecords(records);
            showToast('第 ' + sessions.length + ' 次上班打卡成功');
            updateUI();
        }
        function clockOut() {
            var records = getRecords(), today = getToday();
            var day = records[today];
            if (isHolidayRec(day)) { showToast('今天放假，无需打卡'); return; }
            var sessions = day ? (day.sessions || []) : [];
            if (!sessions.length) { showToast('请先打上班卡'); return; }
            var last = sessions[sessions.length - 1];
            if (last.end) { showToast('请先打上班卡'); return; }
            last.end = new Date().toISOString();
            saveRecords(records);
            var completed = sessions.length >= MAX_SESSIONS && sessions.every(function (s) { return s.start && s.end; });
            showToast(completed ? '下班打卡成功，今日全部完成！' : '第 ' + sessions.length + ' 次下班打卡成功');
            updateUI();
        }
        function toggleHoliday() {
            var records = getRecords(), today = getToday();
            var day = records[today] || { sessions: [] };
            var on = !isHolidayRec(day);
            day.holiday = on;
            day.plan = on ? 'holiday' : 'work';
            records[today] = day;
            saveRecords(records);
            showToast(on ? '今天放假，不记录打卡' : '已取消放假，恢复正常打卡');
            updateUI();
        }
        function calcTotalDuration(sessions) {
            var ms = 0;
            sessions.forEach(function (s) { if (s.start && s.end) ms += new Date(s.end) - new Date(s.start); });
            return Math.floor(ms / 3600000) + '小时' + Math.floor((ms % 3600000) / 60000) + '分钟';
        }

        /* ===== 撤销 ===== */
        var undoArmed = false;
        var undoTimer = null;
        function lastClockEntry() {
            var sessions = toSessions(getTodayRecord());
            if (!sessions.length) return null;
            var last = sessions[sessions.length - 1];
            if (last.end) return { time: last.end, name: '下班卡' };
            if (last.start) return { time: last.start, name: '上班卡' };
            return null;
        }
        function resetUndo() {
            undoArmed = false;
            clearTimeout(undoTimer);
            var btn = document.getElementById('btnUndo');
            var txt = document.getElementById('undoText');
            if (btn) btn.classList.remove('armed');
            if (txt) txt.textContent = '撤销上一次打卡';
        }
        function requestUndo() {
            var info = lastClockEntry();
            if (!info) { showToast('今天还没有可撤销的打卡'); return; }
            if (undoArmed) { performUndo(); return; }
            undoArmed = true;
            var btn = document.getElementById('btnUndo');
            var txt = document.getElementById('undoText');
            var tip = '再点一次确认撤销 ' + formatTime(info.time) + ' ' + info.name;
            btn.classList.add('armed');
            txt.textContent = tip;
            showToast(tip);
            clearTimeout(undoTimer);
            undoTimer = setTimeout(resetUndo, 3000);
        }
        function performUndo() {
            var records = getRecords(), today = getToday();
            var day = records[today];
            var sessions = toSessions(day);
            if (!day || !sessions.length) { resetUndo(); return; }
            var last = sessions[sessions.length - 1];
            var msg;
            if (last.end) { msg = '已撤销 ' + formatTime(last.end) + ' 下班卡'; last.end = null; }
            else { msg = '已撤销 ' + formatTime(last.start) + ' 上班卡'; sessions.pop(); }
            day.sessions = sessions;
            records[today] = day;
            saveRecords(records);
            resetUndo();
            lastState = getState();
            showToast(msg);
            updateUI();
        }

        /* ===== 主页面渲染 ===== */
        function getCharacterImage() {
            var rec = getTodayRecord();
            if (isHolidayRec(rec)) return 'character_body.png';
            var sessions = toSessions(rec);
            if (sessions.length === 0) return 'character_body.png';
            var completed = sessions.length >= MAX_SESSIONS && sessions.every(function (s) { return s.start && s.end; });
            var hasOpen = sessions.some(function (s) { return s.start && !s.end; });
            return (completed || !hasOpen) ? 'rest_cut.png' : 'work_cut.png';
        }
        function updateUI() {
            var rec = getTodayRecord();
            var content = document.getElementById('todayContent');
            var dur = document.getElementById('durationBox');
            var label = document.getElementById('statusLabel');
            var btnS = document.getElementById('btnStart');
            var btnE = document.getElementById('btnEnd');
            var btnU = document.getElementById('btnUndo');
            var isHoliday = isHolidayRec(rec);

            var avatar = document.getElementById('mascotAvatar');
            avatar.src = getCharacterImage();
            avatar.classList.toggle('on-holiday', isHoliday);
            var tg = document.getElementById('holidayToggle');
            tg.classList.toggle('on', isHoliday);
            document.getElementById('holidayToggleText').textContent = isHoliday ? '放假中' : '放假模式';

            var currentState = getState();
            if (!firstLoad && currentState !== lastState) {
                var t = getMascotText(currentState);
                if (t) showMascotText(t);
            }
            lastState = currentState;
            firstLoad = false;

            if (isHoliday) {
                content.innerHTML = '<div class="holiday-info">今天放假，不记录打卡</div>';
                label.textContent = '放假中';
                label.className = 'status-pill holiday';
                btnS.disabled = true; btnE.disabled = true;
                dur.style.display = 'none';
                btnU.style.display = 'none';
                resetUndo();
                updateHistory();
                return;
            }

            var sessions = toSessions(rec);
            btnU.style.display = sessions.length ? 'flex' : 'none';
            if (!sessions.length) resetUndo();

            if (sessions.length) {
                var h = '';
                sessions.forEach(function (s, i) {
                    var num = sessions.length > 1 ? i + 1 : '';
                    h += '<div class="record-row"><div class="record-label"><span class="dot start"></span>上班' + num + '</div><div class="record-value">' + formatTime(s.start) + '</div></div>';
                    if (s.end) h += '<div class="record-row"><div class="record-label"><span class="dot end"></span>下班' + num + '</div><div class="record-value">' + formatTime(s.end) + '</div></div>';
                });
                content.innerHTML = h;

                var completed = sessions.length >= MAX_SESSIONS && sessions.every(function (s) { return s.start && s.end; });
                var hasOpen = sessions.some(function (s) { return s.start && !s.end; });

                if (completed) {
                    dur.style.display = 'block';
                    dur.innerHTML = '今日工作时长 <strong>' + calcTotalDuration(sessions) + '</strong>';
                    label.textContent = '今日已完成';
                    label.className = 'status-pill done';
                    btnS.disabled = true; btnE.disabled = true;
                } else if (hasOpen) {
                    label.textContent = '工作中 · 第 ' + sessions.length + ' 次';
                    label.className = 'status-pill working';
                    btnS.disabled = true; btnE.disabled = false;
                    dur.style.display = 'none';
                } else {
                    label.textContent = '已完成 ' + sessions.length + '/' + MAX_SESSIONS + ' 次';
                    label.className = 'status-pill';
                    btnS.disabled = false; btnE.disabled = false;
                    dur.style.display = 'none';
                }
            } else {
                content.innerHTML = '';
                label.textContent = '等待打卡';
                label.className = 'status-pill';
                btnS.disabled = false; btnE.disabled = false;
                dur.style.display = 'none';
            }
            updateHistory();
        }
        function updateHistory() {
            var records = getRecords();
            var dates = Object.keys(records).sort().reverse().slice(0, 7);
            var el = document.getElementById('historyList');
            var cnt = document.getElementById('recordCount');
            var emptyHtml = '<div class="empty"><div class="art"><svg width="40" height="40" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/><path d="M12 7v5.2l3.2 2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="text">还没有打卡记录</div><div class="hint">点击上方按钮开始打卡吧</div></div>';
            cnt.textContent = dates.length ? dates.length + ' 天' : '';
            if (!dates.length) { el.innerHTML = emptyHtml; return; }
            var h = '';
            dates.forEach(function (d) {
                var r = records[d];
                var sessions = toSessions(r);
                if ((r.holiday || r.plan === 'holiday') && !hasClocks(r)) {
                    h += '<div class="history-item"><div class="history-date">' + formatDate(d) + '</div><div class="history-times"><span style="color:#8A97B5">放假</span></div></div>';
                    return;
                }
                if (!hasClocks(r)) return;
                h += '<div class="history-item"><div class="history-date">' + formatDate(d) + '</div>';
                sessions.forEach(function (s, i) {
                    var num = sessions.length > 1 ? i + 1 : '';
                    h += '<div class="history-times"><span>上班' + num + ' ' + formatTime(s.start) + '</span>' +
                        (s.end ? '<span>下班' + num + ' ' + formatTime(s.end) + '</span>' : '<span style="color:#C0B6A6">未打下班卡</span>') + '</div>';
                });
                var allDone = sessions.length >= MAX_SESSIONS && sessions.every(function (s) { return s.start && s.end; });
                if (allDone) h += '<div class="history-times" style="color:#5F7D5B;font-weight:600;margin-top:4px"><span>总时长 ' + calcTotalDuration(sessions) + '</span></div>';
                h += '</div>';
            });
            el.innerHTML = h || emptyHtml;
        }

        /* ===== 标签切换 ===== */
        function switchTab(which) {
            var isCal = which === 'cal';
            document.getElementById('pageClock').hidden = isCal;
            document.getElementById('pageCalendar').hidden = !isCal;
            document.getElementById('tabClock').classList.toggle('on', !isCal);
            document.getElementById('tabCal').classList.toggle('on', isCal);
            if (isCal) renderCalendar();
            // 切换页面后重算高度，否则 hidden 的 page 拿不到 clientHeight
            requestAnimationFrame(function () { layout(); });
        }

        /* ===== 日历 ===== */
        var calYear, calMonth, selectedKey = null;

        function dayStatus(rec) {
            if (!rec) return 'none';
            if (rec.holiday || rec.plan === 'holiday') return 'holiday';
            if (rec.plan === 'rest') return 'rest';
            if (hasClocks(rec)) return 'work';
            if (rec.plan === 'work') return 'planned';
            return 'none';
        }
        function statusName(s) {
            return { 'work': '已打卡', 'planned': '计划上班', 'holiday': '放假', 'rest': '休息', 'none': '无安排' }[s] || '无安排';
        }
        function shiftMonth(n) {
            if (n === 0) {
                var t = parseKey(getToday());
                calYear = t.y; calMonth = t.m;
            } else {
                calMonth += n;
                if (calMonth < 0) { calMonth = 11; calYear--; }
                if (calMonth > 11) { calMonth = 0; calYear++; }
            }
            renderCalendar();
        }
        function renderCalendar() {
            var records = getRecords();
            var first = new Date(calYear, calMonth, 1);
            var startDow = first.getDay();
            var daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
            var todayKey = getToday();

            document.getElementById('calTitle').textContent = calYear + '年' + (calMonth + 1) + '月';

            var html = '';
            var i;
            for (i = 0; i < startDow; i++) html += '<div class="cal-cell empty"></div>';
            for (i = 1; i <= daysInMonth; i++) {
                var key = fmtDate(calYear, calMonth, i);
                var rec = records[key];
                var st = dayStatus(rec);
                var dow = new Date(calYear, calMonth, i).getDay();
                var cls = 'cal-cell ' + st;
                if (dow === 0 || dow === 6) cls += ' weekend';
                if (key === todayKey) cls += ' today';
                if (key === selectedKey) cls += ' selected';
                var dot = (rec && rec.note) ? '<i class="note-dot"></i>' : '';
                html += '<div class="' + cls + '" onclick="openDay(\'' + key + '\')">' + i + dot + '</div>';
            }
            document.getElementById('calGrid').innerHTML = html;

            var cnt = { work: 0, holiday: 0, rest: 0 };
            for (i = 1; i <= daysInMonth; i++) {
                var s = dayStatus(records[fmtDate(calYear, calMonth, i)]);
                if (s === 'work') cnt.work++;
                else if (s === 'holiday') cnt.holiday++;
                else if (s === 'rest') cnt.rest++;
            }
            document.getElementById('calSummary').textContent =
                '本月出勤 ' + cnt.work + ' 天 · 放假 ' + cnt.holiday + ' 天 · 休息 ' + cnt.rest + ' 天';

            renderDetail(selectedKey, cnt);
            layout(); // 渲染完日历/详情后重算高度
        }
        function renderDetail(key, cnt) {
            var box = document.getElementById('calDetail');
            var calIcon = '<div class="empty-art"><svg width="24" height="24" viewBox="0 0 24 24" fill="none">' +
                '<rect x="3" y="5" width="18" height="16" rx="3" stroke="currentColor" stroke-width="2"/>' +
                '<path d="M8 3v4M16 3v4M3 10h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>' +
                '</svg></div>';
            if (!key) {
                // 未选日期：显示本月概览卡片，占满详情区
                box.className = 'cal-detail is-empty';
                box.innerHTML =
                    calIcon +
                    '<div>' +
                    '<div class="detail-title">点选日期查看或安排</div>' +
                    '<div class="detail-sub">本月概览</div>' +
                    '</div>' +
                    '<div class="detail-box">' +
                    '<div class="row"><span>出勤天数</span><b>' + (cnt ? cnt.work : 0) + ' 天</b></div>' +
                    '<div class="row"><span>放假天数</span><b>' + (cnt ? cnt.holiday : 0) + ' 天</b></div>' +
                    '<div class="row"><span>休息天数</span><b>' + (cnt ? cnt.rest : 0) + ' 天</b></div>' +
                    '</div>' +
                    '<div class="detail-actions">' +
                    '<button class="btn-ghost" onclick="openDay(getToday())">查看今天</button>' +
                    '</div>';
                return;
            }
            box.className = 'cal-detail';
            var rec = getRecords()[key];
            var st = dayStatus(rec);
            var sessions = toSessions(rec);
            var isToday = key === getToday();

            var html = '<div class="detail-title">' + formatDate(key) + ' 星期' + weekdayCN(key) + '</div>';
            html += '<div class="detail-sub">当前状态：' + statusName(st) + (isToday ? ' · 今天' : '') + '</div>';

            if (hasClocks(rec)) {
                html += '<div class="detail-box">';
                sessions.forEach(function (s, i) {
                    if (!s.start) return;
                    var num = sessions.length > 1 ? i + 1 : '';
                    html += '<div class="row"><span>上班' + num + ' → 下班' + num + '</span><b>' +
                        formatTime(s.start) + ' → ' + (s.end ? formatTime(s.end) : '未打卡') + '</b></div>';
                });
                var allDone = sessions.length >= MAX_SESSIONS && sessions.every(function (s) { return s.start && s.end; });
                if (allDone) html += '<div class="row" style="margin-top:6px"><span>总时长</span><b>' + calcTotalDuration(sessions) + '</b></div>';
                html += '</div>';
            }
            if (rec && rec.note) html += '<div class="detail-box">' + escapeHtml(rec.note) + '</div>';

            html += '<div class="detail-actions">' +
                '<button class="btn-primary" onclick="openDay(\'' + key + '\')">设置这一天</button>' +
                '</div>';
            box.innerHTML = html;
        }
        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, function (c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
            });
        }

        /* ===== 日期设置弹层 ===== */
        var sheetKey = null;
        var sheetPlan = 'work';

        function openDay(key) {
            selectedKey = key;
            var rec = getRecords()[key] || {};
            sheetKey = key;
            sheetPlan = (rec.holiday || rec.plan === 'holiday') ? 'holiday' : (rec.plan || 'work');
            document.getElementById('sheetTitle').textContent = formatDate(key) + ' 星期' + weekdayCN(key);
            document.getElementById('noteInput').value = rec.note || '';
            paintSeg();
            document.getElementById('sheetMask').classList.add('show');
            document.getElementById('daySheet').classList.add('show');
            renderCalendar();
        }
        function setPlan(p) { sheetPlan = p; paintSeg(); }
        function paintSeg() {
            var btns = document.querySelectorAll('#planSeg button');
            for (var i = 0; i < btns.length; i++) {
                btns[i].classList.toggle('on', btns[i].getAttribute('data-plan') === sheetPlan);
            }
        }
        function closeSheet() {
            document.getElementById('sheetMask').classList.remove('show');
            document.getElementById('daySheet').classList.remove('show');
        }
        function saveDay() {
            if (!sheetKey) return;
            var records = getRecords();
            var day = records[sheetKey] || { sessions: [] };
            day.plan = sheetPlan;
            day.holiday = (sheetPlan === 'holiday');
            var note = document.getElementById('noteInput').value.trim();
            if (note) day.note = note; else delete day.note;
            records[sheetKey] = day;
            saveRecords(records);
            showToast('已保存');
            closeSheet();
            renderCalendar();
            updateUI();
        }
        function clearDay() {
            if (!sheetKey) return;
            var records = getRecords();
            var day = records[sheetKey];
            if (day) {
                delete day.plan;
                delete day.note;
                day.holiday = false;
                records[sheetKey] = day;
                saveRecords(records);
            }
            sheetPlan = 'work';
            paintSeg();
            document.getElementById('noteInput').value = '';
            showToast('已清除这一天的安排');
            closeSheet();
            renderCalendar();
            updateUI();
        }

        /* ===== Toast / 时钟 ===== */
        var toastTimer = null;
        function showToast(msg) {
            var t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(function () { t.classList.remove('show'); }, 1800);
        }
        function updateClock() {
            var now = new Date();
            document.getElementById('currentTime').textContent =
                now.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            document.getElementById('currentDate').textContent =
                now.toLocaleDateString('zh-CN', { month: 'long', day: 'numeric', weekday: 'long' });
        }

        /* 输入法弹起时把底部弹层顶上去，避免输入框被键盘遮住（小米/安卓必备） */
        /* ===== 精确撑满布局：用 JS 按真实 window.innerHeight 分配每块高度 ===== */
        function layout() {
            // 浏览器壳（如小米浏览器标签页）的 100vh/100dvh 常把工具栏算进去，
            // 导致 flex/grid 百分比失效。这里用 window.innerHeight 作为唯一真相。
            var h = window.innerHeight;
            document.documentElement.style.setProperty('--vh', (h * 0.01) + 'px');

            var page = document.querySelector('.page:not([hidden])');
            if (!page) return;
            var gap = 8;
            var ph = page.clientHeight;
            if (ph < 200) return; // 还未渲染好，跳过

            if (page.id === 'pageClock') {
                var tc = page.querySelector('.time-card');
                var btns = page.querySelector('.buttons');
                var rec = page.querySelector('.records');
                if (!tc || !btns || !rec) return;
                var tcH = Math.round(ph * 0.42);
                var btnH = Math.round(ph * 0.14);
                var recH = Math.max(120, ph - tcH - btnH - gap * 2);
                tc.style.height = tcH + 'px';
                btns.style.height = btnH + 'px';
                rec.style.height = recH + 'px';
            } else if (page.id === 'pageCalendar') {
                var cal = page.querySelector('.cal-card');
                var leg = page.querySelector('.cal-legend');
                var det = page.querySelector('.cal-detail');
                if (!cal || !leg || !det) return;
                if (selectedKey) {
                    var calH = Math.round(ph * 0.64);
                    var legH = Math.round(ph * 0.05);
                    var detH = Math.max(90, ph - calH - legH - gap * 2);
                    cal.style.height = calH + 'px';
                    leg.style.height = legH + 'px';
                    det.style.height = detH + 'px';
                } else {
                    // 未选日期：日历卡更大，详情只保留提示行
                    var calH2 = Math.round(ph * 0.78);
                    var legH2 = Math.round(ph * 0.05);
                    cal.style.height = calH2 + 'px';
                    leg.style.height = legH2 + 'px';
                    det.style.height = 'auto';
                }
            }
        }
        window.addEventListener('resize', layout);
        window.addEventListener('orientationchange', function () { setTimeout(layout, 120); });

        function setupKeyboardInset() {
            var vv = window.visualViewport;
            if (!vv) return;
            var sheet = document.getElementById('daySheet');
            function sync() {
                var gap = window.innerHeight - vv.height - vv.offsetTop;
                var v = (gap > 60 ? gap : 0) + 'px';
                document.documentElement.style.setProperty('--kbd', v);
                if (sheet && sheet.classList.contains('show')) {
                    sheet.scrollTop = sheet.scrollHeight;
                }
            }
            vv.addEventListener('resize', sync);
            vv.addEventListener('scroll', sync);
        }

        initTheme();
        setupKeyboardInset();
        var migratedDays = migrateRecords();
        updateClock();
        setInterval(updateClock, 1000);
        var t0 = parseKey(getToday());
        calYear = t0.y; calMonth = t0.m;
        updateUI();
        // 等一帧再算高度，确保 DOM 尺寸稳定
        requestAnimationFrame(function () { layout(); });
        setupServiceWorker();
        if (migratedDays > 0 && window.console) {
            console.log('[打卡] 已修正 ' + migratedDays + ' 天的日期归属，原始数据备份在 localStorage.clockRecordsBackup');
        }
    </script>
</body>
</html>
